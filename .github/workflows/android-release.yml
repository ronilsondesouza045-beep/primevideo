name: Android Auto Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primevideo-android-release
  cancel-in-progress: false

jobs:

  release:

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor != 'github-actions[bot]' &&
        !contains(github.event.head_commit.message, '[android-meta]')
      )

    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle

      - name: Install web dependencies
        shell: pwsh
        run: |
          npm install --package-lock=false

      - name: Build React inside Android
        shell: pwsh
        run: |
          ./android/build-web.ps1

      - name: Restore Android signing key
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String(
              $env:KEYSTORE_B64
          )

          [IO.File]::WriteAllBytes(
              "$PWD\android\primevideo-release.jks",
              $bytes
          )

      - name: Calculate Android version
        id: version
        shell: pwsh
        run: |
          $versionCode =
              1000 +
              [int]$env:GITHUB_RUN_NUMBER

          $versionName =
              "1.0.$env:GITHUB_RUN_NUMBER"

          $notes =
              git log -1 --pretty=%s

          if (
              [string]::IsNullOrWhiteSpace(
                  $notes
              )
          ) {
              $notes =
                  "Atualizacao do PrimeVideo"
          }

          $notes =
              $notes.Replace(
                  "`r",
                  " "
              )

          $notes =
              $notes.Replace(
                  "`n",
                  " "
              )

          "code=$versionCode" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "name=$versionName" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "notes=$notes" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          Write-Host ""
          Write-Host "VersionName: $versionName"
          Write-Host "VersionCode: $versionCode"
          Write-Host "Notas      : $notes"

      - name: Build signed Android APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}\android\primevideo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          Push-Location android

          try {

              ./gradlew.bat `
                  --no-daemon `
                  clean `
                  :app:assembleRelease `
                  "-PAPP_VERSION_CODE=${{ steps.version.outputs.code }}" `
                  "-PAPP_VERSION_NAME=${{ steps.version.outputs.name }}"

              if ($LASTEXITCODE -ne 0) {
                  throw "Gradle build falhou."
              }

          }
          finally {

              Pop-Location
          }

      - name: Prepare release APK
        shell: pwsh
        run: |
          $source =
              "android\app\build\outputs\apk\release\app-release.apk"

          if (-not (Test-Path $source)) {
              throw "APK release nao encontrado."
          }

          Copy-Item `
              $source `
              "PrimeVideo-Android.apk" `
              -Force

          $size =
              [Math]::Round(
                  (Get-Item "PrimeVideo-Android.apk").Length / 1MB,
                  2
              )

          Write-Host "APK: $size MB"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag =
              "android-v${{ steps.version.outputs.name }}"

          $title =
              "PrimeVideo Android v${{ steps.version.outputs.name }}"

          $notes =
              @"
          PrimeVideo Android ${{ steps.version.outputs.name }}

          O que mudou:
          - ${{ steps.version.outputs.notes }}

          Gerado automaticamente pelo GitHub Actions.
          "@

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {

              gh release upload `
                  $tag `
                  "PrimeVideo-Android.apk" `
                  --clobber
          }
          else {

              gh release create `
                  $tag `
                  "PrimeVideo-Android.apk" `
                  --title $title `
                  --notes $notes `
                  --target main
          }

          if ($LASTEXITCODE -ne 0) {
              throw "Falha ao publicar GitHub Release."
          }

      - name: Update Android version metadata
        shell: pwsh
        run: |
          $versionCode =
              [int]"${{ steps.version.outputs.code }}"

          $versionName =
              "${{ steps.version.outputs.name }}"

          $notes =
              "${{ steps.version.outputs.notes }}"

          $metadata =
              [ordered]@{
                  platform =
                      "android"

                  versionCode =
                      $versionCode

                  versionName =
                      $versionName

                  minVersionCode =
                      1000

                  required =
                      $false

                  title =
                      "Nova versao disponivel"

                  message =
                      "Uma nova versao do PrimeVideo esta disponivel."

                  changes =
                      @(
                          $notes
                      )

                  downloadUrl =
                      "https://github.com/ronilsondesouza045-beep/primevideo/releases/latest/download/PrimeVideo-Android.apk"

                  publishedAt =
                      (Get-Date).ToString("o")
              }

          $json =
              $metadata |
              ConvertTo-Json -Depth 10

          $utf8 =
              New-Object System.Text.UTF8Encoding($false)

          [IO.File]::WriteAllText(
              "$PWD\public\android-version.json",
              $json,
              $utf8
          )

      - name: Publish update metadata
        shell: pwsh
        run: |
          git config `
              user.name `
              "github-actions[bot]"

          git config `
              user.email `
              "41898282+github-actions[bot]@users.noreply.github.com"

          git add `
              public/android-version.json

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {

              Write-Host "Metadata ja estava atualizado."

              exit 0
          }

          git commit `
              -m "[android-meta] Publish Android ${{ steps.version.outputs.name }}"

          git push origin HEAD:main

          if ($LASTEXITCODE -ne 0) {
              throw "Falha ao publicar android-version.json."
          }

      - name: Summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " PRIMEVIDEO ANDROID PUBLICADO"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Versao:"
          Write-Host "  ${{ steps.version.outputs.name }}"
          Write-Host ""
          Write-Host "VersionCode:"
          Write-Host "  ${{ steps.version.outputs.code }}"
          Write-Host ""
          Write-Host "APK:"
          Write-Host "  PrimeVideo-Android.apk"
          Write-Host ""